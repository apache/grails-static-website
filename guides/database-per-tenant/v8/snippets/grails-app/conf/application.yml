info:
  app:
    name: '@info.app.name@'
    version: '@info.app.version@'
    grailsVersion: '@info.app.grailsVersion@'
grails:
  mime:
    disable:
      accept:
        header:
          userAgents:
          - Gecko
          - WebKit
          - Presto
          - Trident
    types:
      all: '*/*'
      atom: application/atom+xml
      css: text/css
      csv: text/csv
      form: application/x-www-form-urlencoded
      html:
      - text/html
      - application/xhtml+xml
      js: text/javascript
      json:
      - application/json
      - text/json
      multipartForm: multipart/form-data
      pdf: application/pdf
      rss: application/rss+xml
      text: text/plain
      hal:
      - application/hal+json
      - application/hal+xml
      xml:
      - text/xml
      - application/xml
  views:
    gsp:
      encoding: UTF-8
      htmlcodec: xml
      codecs:
        expression: html
        scriptlet: html
        taglib: none
        staticparts: none
    default:
      codec: html
  codegen:
    defaultPackage: demo
  profile: web
  # tag::gorm[]
  gorm:
  # end::gorm[]
    # tag::multiTenancy[]
    multiTenancy:
      mode: DATABASE
      tenantResolverClass: org.grails.datastore.mapping.multitenancy.web.SessionTenantResolver
    # end::multiTenancy[]
# tag::dataSources[]
dataSource:
  driverClassName: org.h2.Driver
  username: sa
  password: ''
  pooled: true
  jmxExport: true
  dbCreate: create-drop
  url: jdbc:h2:mem:devDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE

dataSources:
  ford:
    dbCreate: create-drop
    url: jdbc:h2:mem:fordDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
  audi:
    dbCreate: create-drop
    url: jdbc:h2:mem:audiDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
# end::dataSources[]
hibernate:
  cache:
    queries: false
    use_second_level_cache: false
    use_query_cache: false
