name: Publish
on:
  push:
    branches:
      - master
  schedule:
    - cron:  '0 */2 * * *'
  workflow_dispatch:
# Serialize this repo's own overlapping publishes (push vs cron). Cross-repo
# races against grails-core on apache/grails-website asf-site-production are
# retried by publishMainSite (same non-fast-forward rebase as
# apache/grails-github-actions#110). Keep :publishMainSite instead of
# deploy-github-pages: that action can push this same target repo/branch
# (grails-core already does, with TARGET_FOLDER: docs), but a root overlay
# with default PURGE_EXISTING would wipe docs/, and `git add $path/*`
# skips new root .htaccess / .well-known.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
    if: github.repository == 'apache/grails-static-website'
    runs-on: ubuntu-latest
    steps:
      - name: "⚙️ Maximize build space"
        run: |
          echo "-- Dotnet"
          sudo rm -rf /usr/share/dotnet
          echo "-- Android"
          sudo rm -rf /usr/local/lib/android
          echo "-- Haskell"
          sudo rm -rf /opt/ghc
          echo "-- CodeQL"
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          df -h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: liberica
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic # 'basic' uses the MIT-licensed, open-source cache provider; the default 'enhanced' provider (v6+) is proprietary (Gradle commercial Terms of Use)
          develocity-access-key: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
      - name: Publish Main Site
        # The vendored PublishGuideTask is not configuration-cache safe.
        run: ./gradlew clean publishMainSite --console=plain --no-daemon --no-configuration-cache
        env:
          GITHUB_SLUG: apache/grails-website
          GH_TOKEN: ${{ secrets.GRAILS_GHTOKEN }}
          GH_BRANCH: asf-site-production
          GRAILS_WS_URL: https://grails.apache.org
