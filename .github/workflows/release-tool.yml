name: Release Tool
on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Tool artifactId, e.g. grails-intellij-plugin'
        required: true
      artifact_version:
        description: 'New tool version (e.g. 262.1.2)'
        required: true
      mirror_directory:
        description: 'First-time only: sub-path under https://www.apache.org/dyn/closer.lua/grails/ where the tool distribution lives. Ignored for subsequent bumps.'
        required: false
      release_notes_repo:
        description: 'First-time only: GitHub slug (org/repo) used for the v<version> release-notes link. Ignored for subsequent bumps.'
        required: false
      display_name:
        description: 'First-time only: human-readable label rendered on the downloads page. Ignored for subsequent bumps.'
        required: false
jobs:
  release-tool:
    runs-on: ubuntu-latest
    env:
      GIT_USER_NAME: grails-build
      GIT_USER_EMAIL: grails-build@users.noreply.github.com
      ARTIFACT: ${{ github.event.inputs.artifact_id }}
      VERSION: ${{ github.event.inputs.artifact_version }}
      MIRROR_DIRECTORY: ${{ github.event.inputs.mirror_directory }}
      RELEASE_NOTES_REPO: ${{ github.event.inputs.release_notes_repo }}
      DISPLAY_NAME: ${{ github.event.inputs.display_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17
      - name: Record tool release
        run: |
          ./gradlew --no-daemon recordToolRelease \
            -PartifactId="${ARTIFACT}" \
            -PartifactVersion="${VERSION}" \
            -PmirrorDirectory="${MIRROR_DIRECTORY}" \
            -PreleaseNotesRepo="${RELEASE_NOTES_REPO}" \
            -PdisplayName="${DISPLAY_NAME}"
      - name: Commit tool release
        run: |
          git config user.name ${GIT_USER_NAME}
          git config user.email ${GIT_USER_EMAIL}
          git add conf/releases.yml
          git commit -m "Update conf/releases.yml" -m "Bump ${ARTIFACT} to ${VERSION}"
          git push
